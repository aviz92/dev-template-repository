# https://taskfile.dev

version: "3"

tasks:
  install-uv:
    desc: Install uv if not already installed.
    cmds:
      - |
        if ! command -v uv >/dev/null 2>&1; then
          echo "Installing uv..."
          curl -LsSf https://astral.sh/uv/install.sh | sh
        else
          echo "uv already installed at $(command -v uv)"
        fi

  install_dependencies:
    desc: Install all dependencies.
    deps:
      - install-uv
    cmds:
      - task: clean
      - pwd
      - rm uv.lock || true
      - "{{.UV_BIN}} sync"

  build:
    desc: Build the package.
    deps:
      - install-uv
    cmds:
      - task: clean
      - echo "Building the package..."
      - "{{.UV_BIN}} run python -m build"

  clean:
    desc: Clean the repo.
    cmds:
      - echo "Cleaning the repo..."
      - rm -rf *.egg-info
      - rm -rf build
      - rm -rf dist

  pre_commit:
    desc: Pre-commit all files.
    cmds:
      - |
        echo "Running pre-commit hooks on all files..."
        set -a
        source .env
        set +a
        "{{.UV_BIN}}" run pre-commit run --all-files
