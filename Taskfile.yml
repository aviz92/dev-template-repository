# https://taskfile.dev
# Installation on mac: brew install go-task/tap/go-task

version: "3"

dotenv:
  - .env

includes:
  infra: .venv/lib/python3.13/site-packages/python_base_toolkit/ci/task_files/includes.yml

tasks:
  print-vars:
    desc: "Print all task variables - command: task print-vars --verbose"
    cmds:
      - |
        echo {{.OS}}
